name: Prijzen bijwerken en website publiceren

on:
  schedule:
    - cron: '20 5 * * *'      # elke ochtend rond 06:20 (winter) / 07:20 (zomer), na de nachtelijke update van PrijsProfeet
  push:
    branches: [main]
    paths: ['web/**', 'site/**', '.github/workflows/dagelijks.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # eerst de tests: met een fout in de rekenmodule wordt er niets gepubliceerd
      - name: Tests draaien
        if: github.event_name != 'schedule'   # een trage testrun mag de prijsupdate van de ochtend niet tegenhouden
        run: node --test tests/*.test.js

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - run: pip install pillow==13.0.0

      - name: Nieuwe prijzen en aanbiedingen ophalen
        if: github.event_name != 'push'
        run: |
          git clone --shallow-since="$(date -d '15 months ago' +%F)" https://github.com/supermarkt/checkjebon.git /tmp/cjb
          python3 -I kit/freshness.py /tmp/cjb /tmp/fresh.json
          python3 -I kit/fetch_promos.py /tmp/promos.json
          timeout 25m python3 -I kit/fetch_images.py /tmp/promos.json data/images.json data/img 1500 || echo "foto's deels overgeslagen"
          python3 -I kit/compact.py /tmp/cjb/data/supermarkets.json /tmp/promos.json /tmp/fresh.json /tmp/data.b64 data/images.json data/fotolinks.json
          # vergelijken met wat nu op de website staat; bij een half mislukte import stopt de run hier
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          curl -fsSL "https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/data.b64" -o /tmp/site.b64 || cp data/data.b64 /tmp/site.b64
          python3 -I kit/check.py /tmp/data.b64 /tmp/site.b64
          cp /tmp/data.b64 data/data.b64

      - name: Nieuwe foto's bewaren
        if: github.event_name != 'push'
        run: |
          git config user.name "slim-boodschappen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/images.json data/img data/fotolinks.json
          if ! git diff --cached --quiet; then
            git commit -m "Nieuwe productfoto's $(date +%F)"
            # --autostash: data/data.b64 is hier gewijzigd maar wordt niet bewaard; zonder dit weigert git de pull
            # lukt de rebase niet, dan afbreken: anders blijft de repo halverwege staan en zit de nieuwe data.b64 nog in de autostash
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main; then git push && exit 0
              else git rebase --abort || true; fi
              sleep 5
            done
            cp /tmp/data.b64 data/data.b64
            echo "::warning::Nieuwe foto's konden niet worden bewaard"
          fi

      - name: Laatste prijzen van de website gebruiken (bij een wijziging in de app)
        if: github.event_name == 'push'
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          curl -fsSL "https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/data.b64" -o /tmp/site.b64 || exit 0
          python3 - <<'PY'
          import base64, gzip, json, shutil
          def when(p):
              try: return json.loads(gzip.decompress(base64.b64decode(open(p).read())))['promoFetched']
              except Exception: return ''
          if when('/tmp/site.b64') > when('data/data.b64'):
              shutil.copy('/tmp/site.b64', 'data/data.b64'); print('prijzen van de website gebruikt')
          PY

      - name: Website samenstellen
        run: |
          # de gecontroleerde prijzen van deze run gaan altijd voor, wat er bij het bewaren van de foto's ook gebeurde
          if [ -f /tmp/data.b64 ]; then cp /tmp/data.b64 data/data.b64; fi
          mkdir -p _site/img
          cp data/data.b64 _site/
          cp data/img/s*.jpg _site/img/
          cp site/* _site/
          python3 -I web/assemble.py --wrap web/style.html web/body.html web/engine.js data/data.b64 _site/app.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
