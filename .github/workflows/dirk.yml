name: Gewone prijzen Dirk ophalen

# Elke nacht de gewone prijzen van dirk.nl zelf ophalen (in Checkjebon staan ze al maanden stil).
# Rustig: één pagina per seconde, eerlijke User-Agent, robots.txt wordt gevolgd. Duurt ruim twee uur.
# Klaar ruim voor de ochtendupdate (dagelijks.yml), die de prijzen dan in de app zet.
on:
  schedule:
    - cron: '40 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dirk
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Prijzen ophalen
        run: python3 -I kit/fetch_dirk.py data/dirk.json --max-minutes 290

      - name: Bewaren
        run: |
          git config user.name "slim-boodschappen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dirk.json
          if git diff --cached --quiet; then echo "niets veranderd"; exit 0; fi
          git commit -m "Gewone prijzen Dirk $(date +%F)"
          for i in 1 2 3; do
            if git pull --rebase origin main; then git push && exit 0
            else git rebase --abort || true; fi
            sleep 10
          done
          echo "::error::Prijzen van Dirk konden niet worden bewaard"
          exit 1
