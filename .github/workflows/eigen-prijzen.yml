name: Gewone prijzen zelf ophalen

# Elke nacht de gewone prijzen van Dirk, DekaMarkt en Hoogvliet van hun eigen website ophalen
# (in Checkjebon staan ze al maanden stil). Per winkel een eigen taak, naast elkaar; per website
# rustig: één pagina per seconde, eerlijke User-Agent, robots.txt wordt gevolgd, stopt bij een blokkade.
# Klaar voor de ochtendupdate (dagelijks.yml), die de prijzen in de app zet. Wat niet af komt, komt de nacht erna eerst.
on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eigen-prijzen
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        winkel: [dirk, dekamarkt, hoogvliet]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Prijzen ophalen
        run: python3 -I kit/fetch_store.py ${{ matrix.winkel }} data/${{ matrix.winkel }}.json --max-minutes 300

      - name: Bewaren
        run: |
          git config user.name "slim-boodschappen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/${{ matrix.winkel }}.json
          if git diff --cached --quiet; then echo "niets veranderd"; exit 0; fi
          git commit -m "Gewone prijzen ${{ matrix.winkel }} $(date +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main; then git push && exit 0
            else git rebase --abort || true; fi
            sleep $((RANDOM % 20 + 10))
          done
          echo "::error::Prijzen van ${{ matrix.winkel }} konden niet worden bewaard"
          exit 1
