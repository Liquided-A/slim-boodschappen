plugins {
    id 'com.android.application'
}

def ksFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'nl.slimboodschappen.app'
    compileSdk 34

    defaultConfig {
        applicationId 'nl.slimboodschappen.app'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1').toInteger())
        versionName(System.getenv('VERSION_NAME') ?: '1.0')
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }   // alleen telefoons: maakt de download half zo groot
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'b64', 'jpg'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')  // voorkomt dubbele Kotlin-klassen
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
